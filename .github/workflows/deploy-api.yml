name: Deploy API Server

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/**'
      - 'lib/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Replit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server run typecheck

      # The API server is hosted on Replit — pushes to main auto-deploy via
      # the Replit GitHub integration. This step just verifies the build is clean.
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
