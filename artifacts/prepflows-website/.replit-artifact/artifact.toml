kind = "web"
previewPath = "/prepflows-website/"
title = "PrepFlows Website"
version = "1.0.0"
id = "artifacts/prepflows-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26168

[services.development]
run = "pnpm --filter @workspace/prepflows-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prepflows-website", "run", "build" ]
publicDir = "artifacts/prepflows-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26168"
BASE_PATH = "/"
