<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>PrepFlows — Kitchen Operations Software for Hospitality Teams</title>
    <meta
      name="description"
      content="PrepFlows is the operating system for professional kitchens. Manage functions, prep lists, rosters, and live service — all in one place. Free trial, no credit card."
    />
    <meta
      name="keywords"
      content="kitchen operations software, hospitality management, prep list app, function management, kitchen roster, catering software"
    />
    <meta name="author" content="PrepFlows" />
    <link rel="canonical" href="https://prepflows.com/" />

    <!-- Robots -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prepflows.com/" />
    <meta property="og:site_name" content="PrepFlows" />
    <meta
      property="og:title"
      content="PrepFlows — Kitchen Operations Software for Hospitality Teams"
    />
    <meta
      property="og:description"
      content="The operating system for professional kitchens. Manage functions, prep lists, rosters, and live service — all in one place."
    />
    <meta property="og:image" content="https://prepflows.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@prepflows" />
    <meta
      name="twitter:title"
      content="PrepFlows — Kitchen Operations Software"
    />
    <meta
      name="twitter:description"
      content="The operating system for professional kitchens. Manage functions, prep lists, rosters, and live service — all in one place."
    />
    <meta name="twitter:image" content="https://prepflows.com/og-image.png" />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PrepFlows",
        "description": "Kitchen operations software for hospitality teams. Manage functions, prep lists, rosters, and live service.",
        "url": "https://prepflows.com",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "iOS, Android, Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free trial available"
        },
        "publisher": {
          "@type": "Organization",
          "name": "PrepFlows",
          "url": "https://prepflows.com"
        }
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Inter font — self-hosted subset via Google Fonts with display=swap -->
    <!-- Preconnect first to reduce DNS/TLS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load only the weights actually used: 400, 500, 600, 700 -->
    <!-- rel=preload makes fonts non-render-blocking; onload swaps to stylesheet -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
