<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base: deep navy-black -->
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0C1828"/>
      <stop offset="100%" stop-color="#060D18"/>
    </linearGradient>

    <!-- Glass body: blue-tinted inner layer -->
    <linearGradient id="glass" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1A3A6B" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#0E1F40" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060D18" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Top specular: white glare (key glass effect) -->
    <radialGradient id="spec-top" cx="50%" cy="-8%" r="68%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="white" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Left edge specular -->
    <linearGradient id="spec-left" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="white" stop-opacity="0.16"/>
      <stop offset="18%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- P letterform: digital watch navy-to-electric-blue gradient -->
    <linearGradient id="p-grad" x1="18" y1="10" x2="82" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C7E8FF"/>
      <stop offset="25%"  stop-color="#60A5FA"/>
      <stop offset="60%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0F2554"/>
    </linearGradient>

    <!-- P glow bloom -->
    <radialGradient id="glow-bg" cx="54%" cy="42%" r="44%">
      <stop offset="0%"   stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <!-- Top-face shine on P segments -->
    <linearGradient id="p-shine" x1="18" y1="10" x2="50" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Rim: glass edge -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="white"   stop-opacity="0.35"/>
      <stop offset="40%"  stop-color="white"   stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Inner shadow (depth at bottom) -->
    <linearGradient id="inner-shadow" x1="50" y1="55" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.35"/>
    </linearGradient>

    <clipPath id="icon-clip">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
  </defs>

  <!-- 1. Base -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- 2. Glass body tint -->
  <rect width="100" height="100" rx="22" fill="url(#glass)"/>

  <!-- 3. Glow bloom behind P -->
  <rect width="100" height="100" rx="22" fill="url(#glow-bg)"/>

  <!-- 4. Caustic refraction band -->
  <g clip-path="url(#icon-clip)">
    <path d="M -10 18 Q 28 8 52 22 Q 76 36 112 18 L 112 -4 Q 76 14 52 2 Q 28 -10 -10 6 Z"
          fill="white" fill-opacity="0.05"/>
  </g>

  <!-- 5. Top specular glare -->
  <rect width="100" height="100" rx="22" fill="url(#spec-top)"/>

  <!-- 6. Left edge glare -->
  <rect width="100" height="100" rx="22" fill="url(#spec-left)"/>

  <!-- 7. Bottom inner shadow -->
  <rect width="100" height="100" rx="22" fill="url(#inner-shadow)"/>

  <!--
    8. DIGITAL WATCH "P" — geometric segmented letterform.
       Outer shape: stem + beveled bowl.
       Inner counter (evenodd cutout): the open space inside the bowl.
       Square/chamfered corners give the LCD-segment / watch-digit feel.
  -->
  <g filter="url(#glow)">
    <path
      fill-rule="evenodd"
      fill="url(#p-grad)"
      d="
        M 18 87
        L 18 12
        L 64 12
        L 80 26
        L 80 56
        L 64 68
        L 30 68
        L 30 87
        Z

        M 30 24
        L 56 24
        L 68 34
        L 68 48
        L 56 57
        L 30 57
        Z
      "
    />
  </g>

  <!-- 9. Top-face shine on the P segments -->
  <path
    fill-rule="evenodd"
    fill="url(#p-shine)"
    opacity="0.65"
    d="
      M 18 12
      L 64 12
      L 80 26
      L 80 40
      L 18 40
      Z

      M 30 24
      L 56 24
      L 68 34
      L 68 36
      L 30 36
      Z
    "
  />

  <!-- 10. Rim -->
  <rect width="100" height="100" rx="22"
        stroke="url(#rim)" stroke-width="1.5" fill="none"/>

  <!-- 11. Inner rim -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="21"
        stroke="white" stroke-opacity="0.06" stroke-width="1" fill="none"/>
</svg>
