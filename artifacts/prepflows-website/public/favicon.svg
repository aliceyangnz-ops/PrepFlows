<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#060809"/>
    </linearGradient>
    <!-- Blob: near-white → sky blue → royal blue → deep purple -->
    <radialGradient id="blob" cx="33%" cy="27%" r="75%">
      <stop offset="0%"   stop-color="#EFF6FF"/>
      <stop offset="12%"  stop-color="#7DD3FC"/>
      <stop offset="36%"  stop-color="#3B82F6"/>
      <stop offset="60%"  stop-color="#6366F1"/>
      <stop offset="80%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </radialGradient>
    <filter id="f" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Main fluid blob -->
  <path d="M 57 13 C 78 11, 89 29, 87 52 C 85 73, 69 88, 49 86 C 29 84, 13 67, 14 46 C 15 26, 36 15, 57 13 Z" fill="url(#blob)"/>
  <!-- Specular crescent reflection -->
  <path d="M 32 26 C 39 17, 59 16, 66 25 C 71 32, 57 20, 45 21 C 37 21, 30 31, 32 26 Z" fill="white" opacity="0.48"/>
  <!-- Micro highlight -->
  <path d="M 36 33 C 41 25, 51 24, 55 29 C 47 23, 37 29, 36 33 Z" fill="white" opacity="0.65"/>
  <!-- P letterform -->
  <path d="M 37 72 L 37 28 Q 37 22 43 22 L 55 22 Q 67 22 67 35 L 67 44 Q 67 57 55 57 L 37 57"
    stroke="white" stroke-width="8.5" fill="none"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#f)"/>
</svg>
